name: Demo verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the demo property tests
        run: python -m unittest discover -s demo -v
      - name: Run the end-to-end demonstration
        run: python demo/swarm_demo.py
      - name: Dependency audit (fail closed)
        run: python -m pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
